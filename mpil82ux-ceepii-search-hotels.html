<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ceepii – Homes in London · Over 2,115 results</title>
  <meta name="description" content="Find the best hotels and homes in London. Filter by price, property type, rooms and beds. See results on the map." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://ceepii.com/search/hotels" />

  <!-- Fonts: Syne display + DM Sans body (same family as header) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- Leaflet.js for the interactive map (open source, no API key needed) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ============================================================
       CSS CUSTOM PROPERTIES — shared with header system
    ============================================================ */
    :root {
      --font-display: 'Syne', sans-serif;
      --font-body:    'DM Sans', sans-serif;

      --c-black:      #111111;
      --c-white:      #ffffff;
      --c-bg:         #ffffff;
      --c-surface:    #f7f7f7;
      --c-border:     #e8e8e8;
      --c-muted:      #888888;
      --c-tag-bg:     #f2f2f2;
      --c-accent:     #111111;
      --c-heart:      #e8415a;
      --c-badge-bg:   rgba(255,255,255,0.95);
      --c-map-pin:    #111111;
      --c-map-pin-hover: #e8415a;

      --radius-card:  18px;
      --radius-pill:  999px;
      --radius-tag:   8px;
      --radius-chip:  12px;

      --shadow-card:  0 2px 16px rgba(0,0,0,0.09);
      --shadow-pin:   0 2px 10px rgba(0,0,0,0.18);
      --shadow-filter:0 4px 24px rgba(0,0,0,0.1);

      --header-h:     72px; /* must match the header file */
      --filter-h:     64px;

      --trans:        0.2s ease;
      --trans-spring: 0.38s cubic-bezier(0.22,1,0.36,1);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--c-bg);
      color: var(--c-black);
      overflow-x: hidden;
    }

    /* ============================================================
       LAYOUT SKELETON
       Full-viewport split: left (scrollable results) | right (sticky map)
    ============================================================ */
    .page-shell {
      display: grid;
      /* Left results column + right map column */
      grid-template-columns: minmax(0, 740px) 1fr;
      grid-template-rows: auto 1fr;
      /* Offset for the fixed header + filter bar */
      padding-top: calc(var(--header-h) + var(--filter-h));
      min-height: 100vh;
    }

    /* ── Filter bar spans full width ── */
    .filter-bar {
      grid-column: 1 / -1;
      /* We pull it ABOVE the grid rows so it sits flush below the header */
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0;
      z-index: 900;
      height: var(--filter-h);
      background: var(--c-white);
      border-bottom: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 32px;
      overflow-x: auto;
      scrollbar-width: none; /* hide scrollbar on Firefox */
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    /* ── Results column ── */
    .results-col {
      grid-column: 1;
      padding: 28px 32px 60px;
      overflow-y: auto;
    }

    /* ── Map column ── */
    .map-col {
      grid-column: 2;
      position: sticky;
      top: calc(var(--header-h) + var(--filter-h));
      height: calc(100vh - var(--header-h) - var(--filter-h));
      /* Map fills this container */
    }

    /* ============================================================
       NAVBAR PLACEHOLDER
       (In production this is the actual header component from ceepii-header.html)
    ============================================================ */
    .navbar-placeholder {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      height: var(--header-h);
      background: var(--c-white);
      border-bottom: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .nav-logo {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--c-black);
      text-decoration: none;
    }
    .nav-logo span { color: #6b9fd4; }

    /* Compact search pill in the center (matches image 2 navbar) */
    .nav-search-pill {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1.5px solid var(--c-border);
      border-radius: var(--radius-pill);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow var(--trans);
    }
    .nav-search-pill:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.12); }

    .nav-pill-segment {
      padding: 10px 18px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: var(--c-black);
      border-right: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .nav-pill-segment:last-of-type { border-right: none; }
    .nav-pill-segment svg {
      width: 16px; height: 16px;
      stroke: var(--c-black); fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }

    /* Search icon button (black circle, as in the design) */
    .nav-search-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--c-black);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      margin: 4px;
      flex-shrink: 0;
      transition: background var(--trans), transform var(--trans));
    }
    .nav-search-btn:hover { background: #333; transform: scale(1.05); }
    .nav-search-btn svg {
      width: 15px; height: 15px;
      stroke: white; fill: none;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .nav-list-link {
      font-size: 14px;
      font-weight: 500;
      color: var(--c-black);
      text-decoration: none;
      white-space: nowrap;
    }
    .nav-list-link:hover { text-decoration: underline; text-underline-offset: 3px; }

    .nav-icon-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1.5px solid var(--c-border);
      background: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--c-black);
      transition: background var(--trans);
    }
    .nav-icon-btn:hover { background: var(--c-surface); }
    .nav-icon-btn svg {
      width: 17px; height: 17px;
      stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ============================================================
       FILTER BAR CHIPS
    ============================================================ */
    .filter-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--c-border);
      background: var(--c-white);
      font-family: var(--font-body);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--c-black);
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      transition: border-color var(--trans), box-shadow var(--trans), background var(--trans);
      flex-shrink: 0;
    }
    .filter-chip:hover {
      border-color: #aaa;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .filter-chip.is-active {
      border-color: var(--c-black);
      border-width: 2px;
    }
    .filter-chip svg {
      width: 12px; height: 12px;
      stroke: currentColor; fill: none;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* Badge on chip (active filter count) */
    .chip-badge {
      position: absolute;
      top: -7px; right: -7px;
      min-width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--c-black);
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px;
      border: 2px solid white;
    }

    /* ============================================================
       RESULTS HEADER
    ============================================================ */
    .results-header {
      margin-bottom: 22px;
    }
    .results-count {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--c-black);
      letter-spacing: -0.02em;
    }

    /* ============================================================
       RESULTS GRID — 2 columns
    ============================================================ */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    /* ============================================================
       HOTEL CARD
    ============================================================ */
    .hotel-card {
      border-radius: var(--radius-card);
      background: var(--c-white);
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--trans-spring), box-shadow var(--trans-spring);
    }
    .hotel-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-card);
    }

    /* ── Card image area ── */
    .card-img {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      border-radius: var(--radius-card);
      background: var(--c-surface);
    }
    .card-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .hotel-card:hover .card-img img { transform: scale(1.04); }

    /* Badge top-left (Guest favourite / Popular) */
    .card-badge {
      position: absolute;
      top: 12px; left: 12px;
      background: var(--c-badge-bg);
      backdrop-filter: blur(6px);
      border-radius: var(--radius-pill);
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      color: var(--c-black);
      pointer-events: none;
    }

    /* Heart / wishlist button top-right */
    .card-heart {
      position: absolute;
      top: 12px; right: 12px;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform var(--trans);
    }
    .card-heart:hover { transform: scale(1.15); }
    .card-heart svg {
      width: 22px; height: 22px;
      stroke: white;
      fill: transparent;
      stroke-width: 2;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.35));
      transition: fill var(--trans), stroke var(--trans);
    }
    .card-heart.is-liked svg {
      fill: var(--c-heart);
      stroke: var(--c-heart);
    }

    /* Dots indicator (image carousel dots) */
    .card-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
    }
    .card-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
      transition: background var(--trans), width var(--trans);
    }
    .card-dot.is-active {
      background: white;
      width: 18px;
      border-radius: 3px;
    }

    /* ── Card body ── */
    .card-body {
      padding: 13px 2px 6px;
    }

    .card-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }

    .card-title {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--c-black);
      line-height: 1.3;
    }

    .card-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .card-rating svg {
      width: 13px; height: 13px;
      fill: var(--c-black);
      stroke: none;
    }
    .card-rating-score {
      font-size: 13.5px;
      font-weight: 600;
    }
    .card-rating-count {
      font-size: 13px;
      color: var(--c-muted);
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--c-muted);
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Feature tags */
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .card-tag {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--c-black);
      background: var(--c-tag-bg);
      border-radius: var(--radius-tag);
      padding: 4px 9px;
    }
    .card-tag svg {
      width: 12px; height: 12px;
      stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Price row */
    .card-price {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .card-price-amount {
      font-size: 15px;
      font-weight: 700;
      color: var(--c-black);
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }
    .card-price-label {
      font-size: 13px;
      color: var(--c-black);
    }

    /* ============================================================
       PAGINATION
    ============================================================ */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 48px;
      padding-bottom: 24px;
    }

    .page-btn {
      min-width: 38px; height: 38px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      border: 1.5px solid transparent;
      background: transparent;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: var(--c-black);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 6px;
      transition: background var(--trans), border-color var(--trans);
    }
    .page-btn:hover { background: var(--c-surface); }
    .page-btn.is-active {
      background: var(--c-black);
      color: white;
    }
    .page-btn:disabled { color: var(--c-muted); cursor: default; }
    .page-btn:disabled:hover { background: transparent; }
    .page-btn svg {
      width: 14px; height: 14px;
      stroke: currentColor; fill: none;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }
    .page-ellipsis {
      font-size: 14px;
      color: var(--c-muted);
      padding: 0 4px;
      user-select: none;
    }

    /* ============================================================
       MAP
    ============================================================ */
    #map {
      width: 100%;
      height: 100%;
    }

    /* Custom Leaflet tile override for minimal style */
    .leaflet-container {
      font-family: var(--font-body);
    }

    /* Price marker on map */
    .map-price-marker {
      background: var(--c-white);
      border-radius: var(--radius-pill);
      padding: 7px 13px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      color: var(--c-black);
      box-shadow: var(--shadow-pin);
      white-space: nowrap;
      cursor: pointer;
      border: 2px solid transparent;
      transition: background var(--trans), color var(--trans), transform var(--trans);
      transform-origin: center bottom;
    }
    .map-price-marker:hover,
    .map-price-marker.is-active {
      background: var(--c-black);
      color: white;
      transform: scale(1.08);
    }

    /* Leaflet zoom controls (custom style) */
    .leaflet-control-zoom {
      border: none !important;
      box-shadow: var(--shadow-pin) !important;
    }
    .leaflet-control-zoom a {
      font-family: var(--font-body) !important;
      color: var(--c-black) !important;
      border-color: var(--c-border) !important;
      width: 34px !important;
      height: 34px !important;
      line-height: 34px !important;
      font-size: 18px !important;
    }

    /* Expand map button (bottom right) */
    .leaflet-control-fullscreen a {
      background-image: none !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 1024px) {
      .page-shell { grid-template-columns: 1fr; }
      .map-col { display: none; } /* Hide map on tablet, show toggle button instead */
      .results-col { padding: 20px 20px 48px; }
      .filter-bar { padding: 0 20px; }
      .navbar-placeholder { padding: 0 20px; }
      .nav-search-pill { display: none; } /* compact on tablet */
    }

    @media (max-width: 640px) {
      .results-grid { grid-template-columns: 1fr; }
      :root { --header-h: 60px; }
    }

    /* ============================================================
       ENTRY ANIMATION — cards stagger in on load
    ============================================================ */
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hotel-card {
      animation: cardEnter 0.45s both;
    }
    /* Stagger each card via nth-child */
    .hotel-card:nth-child(1)  { animation-delay: 0.04s; }
    .hotel-card:nth-child(2)  { animation-delay: 0.09s; }
    .hotel-card:nth-child(3)  { animation-delay: 0.14s; }
    .hotel-card:nth-child(4)  { animation-delay: 0.19s; }
    .hotel-card:nth-child(5)  { animation-delay: 0.24s; }
    .hotel-card:nth-child(6)  { animation-delay: 0.28s; }
    .hotel-card:nth-child(7)  { animation-delay: 0.32s; }
    .hotel-card:nth-child(8)  { animation-delay: 0.36s; }
    .hotel-card:nth-child(9)  { animation-delay: 0.40s; }
    .hotel-card:nth-child(10) { animation-delay: 0.44s; }
  </style>
</head>
<body>

<!-- ============================================================
     NAVBAR (simplified inline — in production replace with
     the full ceepii-header.html component)
============================================================ -->
<header class="navbar-placeholder" role="banner">

  <a href="/" class="nav-logo" aria-label="Ceepii homepage">Ceepii<span>.</span></a>

  <!-- Compact search pill (state: results page) -->
  <button class="nav-search-pill" aria-label="Edit search: Homes in London, Mar 20–25, 1 guest">
    <span class="nav-pill-segment">
      <!-- House icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      Homes in London
    </span>
    <span class="nav-pill-segment">Mar 20 – 25</span>
    <span class="nav-pill-segment" style="border-right:none;">1 guest</span>
    <button class="nav-search-btn" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </button>

  <div class="nav-right">
    <a href="/list-property" class="nav-list-link">List your property</a>
    <!-- User icon -->
    <button class="nav-icon-btn" aria-label="User account">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
    <!-- Hamburger -->
    <button class="nav-icon-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
</header>

<!-- ============================================================
     FILTER BAR
============================================================ -->
<nav class="filter-bar" aria-label="Search filters" role="navigation">

  <!-- Property type (active — has badge) -->
  <button class="filter-chip is-active" aria-label="Filter by property type, 2 active" aria-pressed="true">
    Property type
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    <span class="chip-badge" aria-hidden="true">2</span>
  </button>

  <!-- Price range -->
  <button class="filter-chip" aria-label="Filter by price range" aria-pressed="false">
    Price range
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
  </button>

  <!-- Rooms & beds -->
  <button class="filter-chip" aria-label="Filter by rooms and beds" aria-pressed="false">
    Rooms &amp; beds
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
  </button>

  <!-- All filters (active — has badge) -->
  <button class="filter-chip is-active" aria-label="All filters, 4 active" aria-pressed="true">
    <!-- sliders icon -->
    <svg viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px;stroke-width:2;">
      <line x1="4" y1="6" x2="20" y2="6"/>
      <line x1="8" y1="12" x2="16" y2="12"/>
      <line x1="11" y1="18" x2="13" y2="18"/>
    </svg>
    All filters
    <span class="chip-badge" aria-hidden="true">4</span>
  </button>
</nav>

<!-- ============================================================
     MAIN CONTENT: results + map
============================================================ -->
<div class="page-shell">

  <!-- ── LEFT: Results column ── -->
  <main class="results-col" id="main-content">

    <!-- Count heading -->
    <header class="results-header">
      <h1 class="results-count">Over 2,115 homes</h1>
    </header>

    <!-- Results grid -->
    <section aria-label="Search results">
      <div class="results-grid" id="results-grid">
        <!-- Cards are injected by JS below (data-driven) -->
      </div>
    </section>

    <!-- Pagination -->
    <nav class="pagination" aria-label="Results pages" role="navigation">
      <!-- Previous -->
      <button class="page-btn" aria-label="Previous page" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Previous
      </button>
      <button class="page-btn" aria-label="Page 1">1</button>
      <button class="page-btn" aria-label="Page 2">2</button>
      <button class="page-btn is-active" aria-label="Page 3, current" aria-current="page">3</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  /* ═══════════════════════════════════════════════════════════

  const hotels = [

    {
      id: 10,
      name: "Woodland Hills Foothills",

      rating: 4.9, reviews: 188,
      price: 339, nights: 2,

      amenities: ["Free wifi", "5 beds", "Free parking", "Kitchen", "Beachfront", "City center"],
      lat: 43.0620, lng: -89.4320,
      imgSeed: 100,
      liked: false,
    },
  ];

  /* ═══════════════════════════════════════════════════════════
     2. RENDER HOTEL CARDS
  ═══════════════════════════════════════════════════════════ */

  /* Maps amenity name → SVG icon path snippet */
  function amenityIcon(name) {
    const n = name.toLowerCase();
    if (n.includes('wifi'))    return '<circle cx="12" cy="20" r="1"/><path d="M2 8.82a15 15 0 0120 0"/><path d="M5 12.85a10 10 0 0114 0"/><path d="M8.5 16.9a5 5 0 017 0"/>';
    if (n.includes('parking')) return '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 17V7h4a3 3 0 010 6H9"/>';
    if (n.includes('kitchen')) return '<path d="M3 7h18M3 12h18M9 12v5M15 12v5M5 7V4a1 1 0 011-1h12a1 1 0 011 1v3"/>';
    if (n.includes('beach'))   return '<path d="M2 20l10-8 10 8M12 12V4M8 8c0-2.2 1.8-4 4-4"/>';
    if (n.includes('city'))    return '<path d="M3 21h18M9 21V9l3-6 3 6v12M3 21V11l6-4M21 21V11l-6-4"/>';
    if (n.includes('bed') || n.includes('beds')) return '<path d="M2 20v-8a2 2 0 012-2h16a2 2 0 012 2v8"/><path d="M2 14h20M7 14v-4a1 1 0 011-1h8a1 1 0 011 1v4"/>';
    return '<circle cx="12" cy="12" r="4"/>';
  }

  function buildCard(hotel) {
    /* Only show first 3 amenity tags to keep cards tidy */
    const tagsHtml = hotel.amenities.slice(0, 3).map(a => `
      <span class="card-tag">
        <svg viewBox="0 0 24 24" aria-hidden="true">${amenityIcon(a)}</svg>
        ${a}
      </span>`).join('');

    const badgeHtml = hotel.badge
      ? `<span class="card-badge">${hotel.badge}</span>`
      : '';

    const ratingStarHtml = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>`;

    return `
      <article class="hotel-card"
               data-id="${hotel.id}"
               role="article"
               aria-label="${hotel.name}, $${hotel.price} for ${hotel.nights} nights, rated ${hotel.rating}">

        <!-- Image -->
        <div class="card-img">
          <img src="https://picsum.photos/seed/${hotel.imgSeed}/600/450"
               alt="${hotel.name} exterior view"
               loading="lazy"
               width="600" height="450" />
          ${badgeHtml}
          <button class="card-heart ${hotel.liked ? 'is-liked' : ''}"
                  data-id="${hotel.id}"
                  aria-label="${hotel.liked ? 'Remove from wishlist' : 'Add to wishlist'}: ${hotel.name}"
                  aria-pressed="${hotel.liked}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
            </svg>
          </button>
          <!-- Carousel indicator dots -->
          <div class="card-dots" aria-hidden="true">
            <span class="card-dot is-active"></span>
            <span class="card-dot"></span>
            <span class="card-dot"></span>
            <span class="card-dot"></span>
          </div>
        </div>

        <!-- Body -->
        <div class="card-body">
          <div class="card-title-row">
            <h2 class="card-title">${hotel.name}</h2>
            <div class="card-rating" aria-label="Rating ${hotel.rating} out of 5, ${hotel.reviews} reviews">
              ${ratingStarHtml}
              <span class="card-rating-score">${hotel.rating}</span>
              <span class="card-rating-count">(${hotel.reviews})</span>
            </div>
          </div>
          <p class="card-subtitle">${hotel.subtitle}</p>
          <div class="card-tags" aria-label="Amenities">${tagsHtml}</div>
          <div class="card-price">
            <span class="card-price-amount" aria-label="Price $${hotel.price}">$${hotel.price}</span>
            <span class="card-price-label">for ${hotel.nights} nights</span>
          </div>
        </div>
      </article>`;
  }

  function renderCards() {
    const grid = document.getElementById('results-grid');
    grid.innerHTML = hotels.map(buildCard).join('');

    /* Heart toggle events */
    grid.querySelectorAll('.card-heart').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation(); // Don't open card detail
        const id = +btn.dataset.id;
        const hotel = hotels.find(h => h.id === id);
        hotel.liked = !hotel.liked;
        btn.classList.toggle('is-liked', hotel.liked);
        btn.setAttribute('aria-pressed', String(hotel.liked));
        btn.setAttribute('aria-label',
          `${hotel.liked ? 'Remove from' : 'Add to'} wishlist: ${hotel.name}`);
      });
    });

    /* Card hover → highlight map pin */
    grid.querySelectorAll('.hotel-card').forEach(card => {
      const id = +card.dataset.id;
      card.addEventListener('mouseenter', () => highlightPin(id, true));
      card.addEventListener('mouseleave', () => highlightPin(id, false));
    });
  }

  renderCards();

  /* ═══════════════════════════════════════════════════════════
     3. MAP (Leaflet.js — CartoDB Positron tiles, no key needed)
  ═══════════════════════════════════════════════════════════ */
  const map = L.map('map', {
    center: [43.065, -89.39],
    zoom: 11,
    zoomControl: true,
    scrollWheelZoom: true,
  });

  /* Minimal light-grey tile layer — matches the Carto style in the design */
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://carto.com/">CARTO</a>, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  /* Custom price marker icon factory */
  function createPriceIcon(price, active = false) {
    return L.divIcon({
      className: '',          /* Clear default Leaflet class */
      html: `<div class="map-price-marker${active ? ' is-active' : ''}" role="button" aria-label="Property $${price}">$${price}</div>`,
      iconAnchor: [30, 18],   /* Center-bottom anchor */
      iconSize: null,
    });
  }

  /* Track all markers for cross-reference with cards */
  const markerMap = {};

  hotels.forEach(hotel => {
    const marker = L.marker([hotel.lat, hotel.lng], {
      icon: createPriceIcon(hotel.price),
      title: `${hotel.name} — $${hotel.price}`,
      alt: `${hotel.name}`,
    }).addTo(map);

    /* Popup on click (lightweight — no plugin needed) */
    marker.bindPopup(`
      <strong style="font-family:'DM Sans',sans-serif;font-size:13px;">${hotel.name}</strong><br>
      <span style="font-size:12px;color:#888;">${hotel.subtitle}</span><br>
      <strong style="font-size:13px;">$${hotel.price}</strong> for ${hotel.nights} nights
    `, { closeButton: false, maxWidth: 200 });

    /* Hover interactions */
    marker.on('mouseover', () => {
      marker.setIcon(createPriceIcon(hotel.price, true));
      /* Also highlight the card */
      const card = document.querySelector(`.hotel-card[data-id="${hotel.id}"]`);
      if (card) card.style.boxShadow = '0 0 0 2.5px #111, 0 4px 20px rgba(0,0,0,0.15)';
    });
    marker.on('mouseout', () => {
      if (!marker._active) marker.setIcon(createPriceIcon(hotel.price, false));
      const card = document.querySelector(`.hotel-card[data-id="${hotel.id}"]`);
      if (card) card.style.boxShadow = '';
    });
    marker.on('click', () => {
      marker._active = true;
      marker.setIcon(createPriceIcon(hotel.price, true));
      /* Scroll card into view */
      const card = document.querySelector(`.hotel-card[data-id="${hotel.id}"]`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    markerMap[hotel.id] = marker;
  });

  /* Called by card hover to toggle pin highlight */
  function highlightPin(id, on) {
    const m = markerMap[id];
    const h = hotels.find(h => h.id === id);
    if (!m || !h) return;
    m.setIcon(createPriceIcon(h.price, on));
  }

  /* ═══════════════════════════════════════════════════════════
     4. FILTER CHIP — active toggle (UI demo)
  ═══════════════════════════════════════════════════════════ */
  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      /* Toggle pressed state (in production, open a dropdown/modal) */
      const isActive = chip.classList.toggle('is-active');
      chip.setAttribute('aria-pressed', String(isActive));
    });
  });

  /* ═══════════════════════════════════════════════════════════
     5. PAGINATION — active page toggle (UI demo)
  ═══════════════════════════════════════════════════════════ */
  document.querySelectorAll('.page-btn:not([disabled])').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.classList.contains('is-active')) return;
      if (btn.textContent.trim() === 'Previous' || btn.textContent.trim() === 'Next') return;
      document.querySelectorAll('.page-btn').forEach(b => {
        b.classList.remove('is-active');
        b.removeAttribute('aria-current');
      });
      btn.classList.add('is-active');
      btn.setAttribute('aria-current', 'page');
    });
  });
</script>
